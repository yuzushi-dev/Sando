name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Sando
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'

      - name: Smoke Codex 0.151.0
        run: |
          curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_RELEASE=0.151.0 CODEX_NON_INTERACTIVE=1 sh
          test "$(codex --version)" = "codex-cli 0.151.0"

      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Allow Bubblewrap user namespaces
        run: |
          if sudo sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sudo sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Check Bubblewrap sandbox
        run: bwrap --die-with-parent --ro-bind / / --dev /dev --proc /proc -- true

      - name: Run test suite
        run: npm test

      - name: Check JavaScript
        run: npm run check

      - name: Check public tree
        shell: bash
        run: |
          if [ -n "$(git ls-files 'handoffs/**' 'spikes/**' 'dashboard/**' 'config/**' 'benchmarks/**' 'canary/**' '.internal/**' 'packages/sando/src/canary.mjs' 'packages/sando/src/f2-telemetry.mjs' 'packages/sando/src/instruction-plan*.mjs')" ]; then
            echo "::error::Internal Sando material must not be tracked in the public repository."
            exit 1
          fi
          test "$(git ls-files 'scripts/**')" = "scripts/sync-bundles.mjs"
          docs_files="$(git ls-files 'docs/**')"
          test -n "$docs_files"
          if printf '%s\n' "$docs_files" | grep -Evq '^docs/changelogs/[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\.md$'; then
            echo "::error::Only versioned changelogs may be tracked under docs/."
            exit 1
          fi

      - name: Check npm package contents
        working-directory: packages/sando
        shell: bash
        run: |
          sando_pack_json="$(npm pack --dry-run --json)"
          SANDO_PACK_JSON="$sando_pack_json" node <<'NODE'
          const packageFiles = JSON.parse(process.env.SANDO_PACK_JSON)[0].files.map(({ path }) => path);
          const allowed = /^(LICENSE|README\.md|index\.mjs|package\.json|src\/[a-z0-9-]+\.mjs)$/;
          const forbidden = /(?:canary|instruction-plan|f2[-_])/i;
          const invalid = packageFiles.filter((file) => !allowed.test(file) || forbidden.test(file));
          if (invalid.length > 0) {
            console.error(`Unexpected npm package files: ${invalid.join(', ')}`);
            process.exit(1);
          }
          NODE
